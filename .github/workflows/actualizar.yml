
name: testPush

on:
  push:
    branches:
      - prog1

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Archivos Actualizados"
          commit_user_name: "prog1"
          commit_user_email: "L23070022@huetamo.tecnm.mx"
          commit_author: "Monserrat Suarez <L23070022@huetamo.tecnm.mx>"
